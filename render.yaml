services:
  - type: web
    name: brightchamps-warehouse-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run prisma:generate --workspace @brightchamps/api && npm run build --workspace @brightchamps/api
    startCommand: npm run start:render --workspace @brightchamps/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: team.brightchamps.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

  - type: web
    name: brightchamps-warehouse
    runtime: static
    buildCommand: npm ci && npm run build --workspace @brightchamps/web
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
